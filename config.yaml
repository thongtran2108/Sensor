# =============================================================================
#  Cấu hình đọc cảm biến KEYENCE qua TCP socket (giao tiếp lệnh ASCII)
# -----------------------------------------------------------------------------
#  Kết nối socket tới (ip:port) rồi gửi lệnh + terminator, ví dụ:  M0<CR><LF>
#  Mặc định coi phản hồi là các giá trị ngăn cách bởi dấu phẩy, MỖI KÊNH MỘT
#  GIÁ TRỊ (CH0, CH1, ...). Nếu thiết bị của bạn trả khác, chỉnh phần `protocol`.
#
#  Kiểm tra nhanh trên máy thật:
#    python tools/test_connection.py --watch
#  -> Xem chuỗi phản hồi THÔ để biết đúng định dạng, rồi chỉnh parser/scale.
# =============================================================================

device:
  ip: "192.168.0.10"        # IP của thiết bị (tự đặt)
  port: 8501                # cổng TCP (tự đặt)
  timeout: 2.0              # timeout socket (giây)
  encoding: "ascii"         # giao thức lệnh KEYENCE là ASCII
  terminator: "CRLF"        # CRLF | CR | LF  (hoặc ghi trực tiếp "\r\n")

channels:
  count: 8                  # số cảm biến (kênh) -> CH0..CH7
  # names:                  # (tuỳ chọn) gán tên riêng thay cho CH0, CH1...
  #   0: "F02"
  #   1: "F05"

protocol:
  # all_in_one : gửi `command` 1 lần, phản hồi có 1 giá trị cho mỗi kênh.
  # per_channel: gửi `command_template` cho từng kênh (M0, M1, ... ), mỗi phản hồi 1 giá trị.
  read_mode: "all_in_one"
  command: "M0"             # lệnh đọc giá trị (all_in_one)
  command_template: "M{n}"  # lệnh theo kênh (per_channel); {n} = chỉ số kênh

  # (tuỳ chọn) đọc thêm peak/bottom/pp bằng các lệnh khác (all_in_one).
  # Bỏ trống nếu thiết bị chỉ trả giá trị đo qua M0.
  extra_commands: {}
  #   peak:   "<lệnh peak>"
  #   bottom: "<lệnh bottom>"
  #   pp:     "<lệnh pp>"

  strip_echo: true          # bỏ token đầu nếu là echo lệnh (vd "M0")
  scale: 1.0                # giá trị = số_đọc * scale (KEYENCE thường trả sẵn theo đơn vị hiển thị)
  invalid_tokens: ["F", "FFFFFF", "-FFFFFF", "------", "OVER", "FFFF"]  # token = tràn thang
  invalid_values: [999999999, -999999999]                              # số coi là không hợp lệ

display:
  unit: "mm"
  decimals: 4

polling:
  interval_ms: 200          # chu kỳ đọc (ms)
